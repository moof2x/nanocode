[project]
name = "nanojax"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.4.1",
    "jinja2>=3.1.6",
    "matplotlib>=3.9.0",
    "maturin>=1.9.6",
    "numpy>=2.0.0",
    "pyarrow>=22.0.0",
    "pyyaml>=6.0",
    "rustbpe>=0.1.0",
    "tiktoken>=0.12.0",
    "zarr>=3.1.3",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]"]
cpu = ["jax"]
tpu = ["jax", "jaxlib", "libtpu", "requests"]

[tool.uv]
find-links = [
    "https://storage.googleapis.com/jax-releases/libtpu_releases.html",
    "https://storage.googleapis.com/libtpu-releases/index.html"
]
